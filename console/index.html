<title>Console interne · Algor Access</title>
<meta name="robots" content="noindex, nofollow" />

<script>
  /* Console interne (staff). Depuis la refonte v5, l'accueil n'embarque plus
     l'application React : elle est servie ici et s'ouvre sur la vue Console
     (#comptes et #rapports restent accessibles). */
  if (!/^#(console|comptes|rapports)$/.test(location.hash)) history.replaceState(null, '', '#console');
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  try { window.scrollTo(0, 0); } catch (e) {}
</script>
