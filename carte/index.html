<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de renseignement · Algor Access</title>
<!-- Gate premium : overlay bloquant tant que session + plan premium absents. -->
<script>window.addEventListener('algorAuthReady', function () { window.__algorAuthGranted = true; });</script>
<script type="module" src="../shared/site-auth.js?v=20260630a"></script>


<link rel="stylesheet" href="/shared/home/fonts.css?v=20260625a" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.js"></script>
<style>
  :root{
    --violet:#6B3FA0; --violet-mid:#5650C6; --blue:#2E84D4;
    --grad:linear-gradient(95deg,#6B3FA0,#5650C6 55%,#2E84D4);
    --ink:#1F1437; --tx:#4A4460; --muted:#9089AA;
    --panel:#fff; --ln:rgba(123,90,189,0.18); --ln-soft:rgba(123,90,189,0.10);
    --shadow:0 8px 26px -8px rgba(46,24,87,0.20);
    --jakarta:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#eef0f4;color:var(--tx);font-family:var(--jakarta);overflow:hidden}
  #map{position:absolute;inset:0}
  #loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;
    background:rgba(238,240,244,0.7);font:600 11px/1 var(--jakarta);letter-spacing:.12em;color:var(--violet);text-transform:uppercase}

  /* ── Header ── */
  #header{position:absolute;top:0;left:0;right:0;height:56px;z-index:8;display:flex;align-items:center;gap:16px;
    padding:0 18px;background:transparent;pointer-events:none}
  #header .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none;pointer-events:auto}
  #header .brand img{height:30px;border-radius:7px}
  #country-title{margin:0;font:800 18px/1 var(--jakarta);letter-spacing:-.01em;color:var(--ink)}
  #header .sub{font:600 8px/1 var(--jakarta);letter-spacing:.16em;text-transform:uppercase;color:var(--violet);margin-top:5px}
  #header .spacer{flex:1}
  #counter{font:600 10px/1 var(--jakarta);letter-spacing:.08em;color:var(--violet);text-transform:uppercase;pointer-events:none}

  /* ── Barre constructeur (jetons + saisie) ── */
  #chipbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;flex:0 1 auto;min-width:0;pointer-events:auto}
  .chip{display:inline-flex;align-items:baseline;gap:11px;background:#fff;border:1px solid var(--ln);
    border-left:4px solid var(--violet);padding:9px 16px 11px;border-radius:13px;box-shadow:var(--shadow);font-family:var(--jakarta)}
  .chip-caret{align-self:center;color:var(--muted)}
  .chip-key{font:700 9px/1 var(--jakarta);letter-spacing:.14em;text-transform:uppercase;color:var(--violet)}
  .chip-val{font:700 15.5px/1 var(--jakarta);color:var(--ink)}
  .chip-x{font:600 14px/1 var(--jakarta);color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:5px}
  .chip-x:hover{color:#c0392b;background:rgba(192,57,43,.08)}
  /* Jeton PAYS = primaire (dégradé violet) */
  .chip-pays{background:var(--grad);border:none;box-shadow:0 8px 22px -7px rgba(86,80,198,.6)}
  .chip-pays .chip-key{color:rgba(255,255,255,.82)}
  .chip-pays .chip-val{color:#fff}
  .chip-pays .chip-x{color:rgba(255,255,255,.8)}
  .chip-pays .chip-x:hover{color:#fff;background:rgba(255,255,255,.18)}

  .builder-input-wrap{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--ln);
    border-radius:11px;padding:8px 13px;min-width:210px;box-shadow:var(--shadow)}
  .builder-caret{color:var(--violet);font-size:11px}
  .builder-input{flex:1;background:none;border:none;outline:none;color:var(--ink);font:600 13px var(--jakarta);min-width:168px}
  .builder-input::placeholder{color:var(--muted);font-weight:500}
  .builder-reset{background:#fff;border:1px solid var(--ln);color:var(--violet);cursor:pointer;
    font:700 9px/1 var(--jakarta);letter-spacing:.12em;text-transform:uppercase;padding:9px 13px;border-radius:11px;box-shadow:var(--shadow)}
  .builder-reset:hover{background:rgba(107,63,160,.06)}

  .builder-suggest{position:fixed;z-index:24;max-height:48vh;overflow-y:auto;background:#fff;
    border:1px solid var(--ln);border-radius:12px;box-shadow:0 16px 40px -10px rgba(46,24,87,.34);padding:5px}
  .bs-opt{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;border-radius:8px;
    font:600 13px/1.2 var(--jakarta);color:var(--ink)}
  .bs-opt:hover{background:rgba(107,63,160,.08)}
  .bs-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bs-meta{font:600 9px var(--jakarta);color:var(--muted)}
  .bs-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .bs-empty{padding:11px;font:500 12px var(--jakarta);color:var(--muted)}

  /* ── Jetons éditables sur la carte (clic → sélecteur) ── */
  .chip-edit{appearance:none;-webkit-appearance:none;cursor:pointer;text-align:left;transition:border-color .12s}
  .chip-edit:hover{border-color:var(--violet)}
  .chip-caret{font-size:13px;color:var(--muted);margin-left:1px;transition:transform .18s}
  .chip-pop-open .chip-caret{transform:rotate(180deg)}
  .chip-pays .chip-caret{color:rgba(255,255,255,.85)}
  .chip-on{border-left-color:var(--blue)}

  .facet-pop{position:fixed;z-index:30;min-width:210px;background:#fff;border:1px solid var(--ln);
    border-radius:13px;box-shadow:0 16px 44px -12px rgba(46,24,87,.4);overflow:hidden}
  .fp-head{padding:11px 13px 8px;font:700 8px/1 var(--jakarta);letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
  .fp-body{max-height:46vh;overflow-y:auto;padding:5px}
  .fp-opt{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;cursor:pointer;text-align:left;
    padding:9px 11px;border-radius:9px;font:600 13px var(--jakarta);color:var(--ink)}
  .fp-opt:hover{background:rgba(107,63,160,.08)}
  .fp-opt.on{background:rgba(107,63,160,.12)}
  .fp-l{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fp-n{font:600 9px var(--jakarta);color:var(--muted)}
  .fp-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .fp-empty{padding:11px;font:500 12px var(--jakarta);color:var(--muted)}
  /* ── Calques frontaliers (popup latérale) ── */
  .fp-more{margin-left:4px;color:var(--violet);font:700 15px/1 var(--jakarta)}
  .fp-sub{position:fixed;z-index:31;min-width:188px;background:#fff;border:1px solid var(--ln);
    border-radius:13px;box-shadow:0 16px 44px -12px rgba(46,24,87,.4);overflow:hidden}
  .fp-sub .fp-head{display:flex;align-items:center;gap:6px}
  .fp-sub-row{display:flex;align-items:center;gap:9px;padding:8px 12px}
  .fp-sub-row .fp-l{flex:1;font:600 13px var(--jakarta);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fp-sub-row .fp-n{font:600 9px var(--jakarta);color:var(--muted)}
  .lay-toggle{flex:none;width:36px;height:20px;border-radius:999px;border:none;background:#ddd6ea;cursor:pointer;position:relative;padding:0;transition:background .18s}
  .lay-toggle.on{background:var(--grad)}
  .lay-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(46,24,87,.3);transition:left .18s}
  .lay-toggle.on .lay-knob{left:18px}

  /* ── Calendrier (intervalle) ── */
  .cal-inner{padding:14px;width:300px;max-width:86vw}
  .facet-pop .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .facet-pop .cal-title{font:700 15px var(--jakarta);color:var(--ink)}
  .facet-pop .cal-nav{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ln);background:#fff;border-radius:9px;cursor:pointer;color:var(--violet);font-size:17px;line-height:1;padding:0}
  .facet-pop .cal-nav:hover:not(:disabled){background:rgba(107,63,160,.07)}
  .facet-pop .cal-nav:disabled{opacity:.3;cursor:default}
  .facet-pop .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .facet-pop .cal-dow{margin-bottom:6px}
  .facet-pop .cdow{text-align:center;font:700 9px/1.6 var(--jakarta);color:var(--muted)}
  .facet-pop .cd{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:none;background:#fff;color:var(--ink);border-radius:10px;cursor:pointer;font:600 13px var(--jakarta);padding:0}
  .facet-pop .cd:hover:not(:disabled):not(.cd-sel){background:rgba(107,63,160,.10)}
  .facet-pop .cd-off{color:#9089AA;cursor:default;opacity:.55;text-decoration:line-through}
  .facet-pop .cd-blank{background:none;cursor:default}
  .facet-pop .cd-rng{background:rgba(107,63,160,.13);border-radius:0;box-shadow:0 0 0 2px rgba(107,63,160,.13)}
  .facet-pop .cd-sel{background:var(--grad);color:#fff}
  .facet-pop .cal-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--ln-soft)}
  .facet-pop .cal-range{font:600 11.5px var(--jakarta);color:var(--tx)}
  .facet-pop .cal-actions{display:flex;gap:8px}
  .facet-pop .cal-btn{border:none;cursor:pointer;border-radius:10px;font:700 10px var(--jakarta);letter-spacing:.06em;text-transform:uppercase;padding:9px 14px}
  .facet-pop .cal-ghost{background:#fff;border:1px solid var(--ln);color:var(--violet)}
  .facet-pop .cal-go{background:var(--grad);color:#fff}
  .facet-pop .cal-go:disabled{opacity:.4;cursor:default}

  /* ── Légende ── */
  #legend{position:absolute;top:70px;right:16px;z-index:7;width:216px;max-height:calc(100% - 100px);
    display:flex;flex-direction:column;background:#fff;border:1px solid var(--ln);border-radius:13px;box-shadow:var(--shadow)}
  #legend .lg-head{padding:12px 14px;border-bottom:1px solid var(--ln-soft);
    font:700 8px/1 var(--jakarta);letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
  #legend-items{overflow-y:auto;padding:7px}
  .legend-row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;font:600 12px/1 var(--jakarta);color:var(--ink)}
  .legend-row:hover{background:rgba(107,63,160,.05)}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .legend-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend-count{font:600 9px var(--jakarta);color:var(--muted)}
  .legend-empty{padding:11px 9px;font:500 12px var(--jakarta);color:var(--muted)}

  /* ── Popups ── */
  .humint-popup .mapboxgl-popup-content{background:#fff;border:1px solid var(--ln);border-top:3px solid var(--violet);
    border-radius:12px;padding:0;color:var(--tx);box-shadow:0 14px 40px -10px rgba(46,24,87,.34)}
  .humint-popup .mapboxgl-popup-close-button{color:var(--muted);font-size:17px;padding:3px 8px}
  .popup-header{display:flex;align-items:center;gap:9px;padding:12px 13px 9px}
  .popup-dot-bar{width:4px;height:17px;border-radius:2px;flex:none}
  .popup-actor{font:800 14px var(--jakarta);color:var(--ink)}
  .popup-body{padding:0 13px 13px}
  .popup-row{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--ln-soft)}
  .popup-key{font:700 8px/1.7 var(--jakarta);letter-spacing:.12em;text-transform:uppercase;color:var(--violet);min-width:76px}
  .popup-val{font:500 12px/1.5 var(--jakarta);color:var(--tx)}
  .popup-desc .popup-val{color:var(--ink)}
  .popup-sources{margin-top:8px;padding-top:8px;border-top:1px solid var(--ln-soft);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .popup-sources a{color:var(--blue);text-decoration:none;font:600 10px var(--jakarta);border:1px solid rgba(46,132,212,.3);border-radius:6px;padding:2px 7px}
  .popup-sources span{color:var(--muted);font:500 10px var(--jakarta)}

  /* ── Panneau « Nouveau cette semaine » ── */
  #news{position:absolute;top:10px;right:18px;z-index:7;display:none;flex-direction:column;width:274px;
    max-height:calc(100% - 50px);background:#fff;border:1px solid var(--ln);border-radius:16px;
    box-shadow:0 16px 44px -14px rgba(46,24,87,.3);overflow:hidden}
  .news-head{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid transparent;
    background:linear-gradient(180deg,rgba(107,63,160,.06),rgba(107,63,160,0));cursor:pointer;user-select:none}
  .news-head:hover{background:linear-gradient(180deg,rgba(107,63,160,.1),rgba(107,63,160,.02))}
  .news-open .news-head{border-bottom-color:var(--ln-soft)}
  .news-title{flex:1;font:800 8.5px/1.35 var(--jakarta);letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
  .news-badge{flex:none;background:var(--grad);color:#fff;border-radius:999px;padding:3px 9px;
    font:800 10px var(--jakarta);box-shadow:0 5px 13px -3px rgba(86,80,198,.55);
    animation:badgePulse 1.7s ease-in-out infinite;transform-origin:center}
  /* Replié : on pulse pour inciter au clic. Déplié : on calme. */
  .news-open .news-badge{animation:none}
  @keyframes badgePulse{
    0%{transform:scale(1);box-shadow:0 5px 13px -3px rgba(86,80,198,.55),0 0 0 0 rgba(107,63,160,.5)}
    60%{transform:scale(1.12);box-shadow:0 6px 16px -3px rgba(86,80,198,.7),0 0 0 8px rgba(107,63,160,0)}
    100%{transform:scale(1);box-shadow:0 5px 13px -3px rgba(86,80,198,.55),0 0 0 0 rgba(107,63,160,0)}}
  @media (prefers-reduced-motion:reduce){.news-badge{animation:none}}
  .news-caret{flex:none;color:var(--violet);font-size:14px;transition:transform .18s}
  .news-open .news-caret{transform:rotate(180deg)}
  .news-list{display:none;overflow-y:auto;padding:8px}
  .news-open .news-list{display:block}
  .news-list::-webkit-scrollbar{width:6px}
  .news-list::-webkit-scrollbar-thumb{background:var(--ln);border-radius:6px}
  .news-row{position:relative;display:flex;align-items:center;gap:10px;width:100%;
    border:1px solid transparent;background:#fff;cursor:pointer;text-align:left;
    padding:10px 11px 10px 14px;border-radius:12px;margin-bottom:3px;
    transition:transform .16s,box-shadow .16s,border-color .16s;
    animation:newsIn .42s both;animation-delay:calc(var(--i,0) * 26ms)}
  .news-row:hover{border-color:var(--ln);box-shadow:0 9px 22px -11px rgba(46,24,87,.32);transform:translateX(2px)}
  .news-accent{position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;
    background:var(--c);box-shadow:0 0 9px -1px var(--c)}
  .news-main{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
  .news-top{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
  .news-type{font:700 13.5px/1.15 var(--jakarta);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .news-when{font:600 9px/1 var(--jakarta);color:var(--muted);white-space:nowrap;flex:none;letter-spacing:.03em}
  .news-actor{align-self:flex-start;max-width:100%;font:700 9px/1 var(--jakarta);letter-spacing:.07em;text-transform:uppercase;
    color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff);
    border:1px solid color-mix(in srgb,var(--c) 24%,#fff);
    padding:3px 7px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .news-go{flex:none;font:700 15px/1 var(--jakarta);color:var(--c);opacity:0;transform:translateX(-4px);
    transition:opacity .16s,transform .16s}
  .news-row:hover .news-go{opacity:1;transform:translateX(0)}
  .news-empty{padding:14px 15px;font:500 12px/1.5 var(--jakarta);color:var(--muted)}
  @keyframes newsIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
  @keyframes newsPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

  /* ── Curseur temporel ── */
  #timeline{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:7;display:none;
    align-items:center;gap:13px;background:#fff;border:1px solid var(--ln);border-radius:14px;
    box-shadow:var(--shadow);padding:9px 16px;max-width:calc(100% - 130px)}
  .tl-btn{width:34px;height:34px;flex:none;border:none;cursor:pointer;border-radius:50%;background:var(--grad);
    color:#fff;font-size:11px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .tl-btn:hover{filter:brightness(1.08)}
  #tl-slider{width:min(440px,44vw);accent-color:var(--violet);cursor:pointer;height:4px}
  #tl-label{font:700 12px var(--jakarta);color:var(--ink);min-width:130px;white-space:nowrap}

  /* ── Panneau d'analyse (graphiques + synthèse IA) ── */
  #analysis{position:absolute;top:64px;left:18px;z-index:7;display:none;flex-direction:column;width:330px;
    max-height:calc(100% - 96px);background:#fff;border:1px solid var(--ln);border-radius:16px;
    box-shadow:0 16px 44px -14px rgba(46,24,87,.3);overflow:hidden}
  .ana-head{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid transparent;
    background:linear-gradient(180deg,rgba(107,63,160,.06),rgba(107,63,160,0));cursor:pointer;user-select:none}
  .ana-head:hover{background:linear-gradient(180deg,rgba(107,63,160,.1),rgba(107,63,160,.02))}
  .ana-open .ana-head{border-bottom-color:var(--ln-soft)}
  .ana-badge{flex:none;background:var(--grad);color:#fff;border-radius:999px;padding:3px 9px;
    font:800 10px var(--jakarta);box-shadow:0 5px 13px -3px rgba(86,80,198,.55)}
  .ana-title{flex:1;font:800 8.5px/1.35 var(--jakarta);letter-spacing:.1em;text-transform:uppercase;color:var(--violet);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ana-caret{flex:none;color:var(--violet);font-size:14px;transition:transform .18s}
  .ana-open .ana-caret{transform:rotate(180deg)}
  .ana-body{display:none;overflow-y:auto;padding:6px 14px 14px}
  .ana-open .ana-body{display:block}
  .ana-body::-webkit-scrollbar{width:6px}
  .ana-body::-webkit-scrollbar-thumb{background:var(--ln);border-radius:6px}
  .ana-sec{padding:11px 0 4px;border-top:1px solid var(--ln-soft)}
  .ana-sec:first-child{border-top:none}
  .ana-sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
  .ana-sec-t{font:800 8.5px/1 var(--jakarta);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
  .ana-sec-n{font:700 9px var(--jakarta);color:var(--muted)}
  .ana-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;padding:3px 5px;margin-left:-5px;margin-right:-5px;border-radius:8px}
  .ana-row-clic{cursor:pointer;transition:background .12s}
  .ana-row-clic:hover{background:rgba(107,63,160,.08)}
  .ana-row-go{flex:none;font:800 13px/1 var(--jakarta);color:var(--violet);opacity:0;transform:translateX(-3px);transition:opacity .14s,transform .14s}
  .ana-row-clic:hover .ana-row-go{opacity:1;transform:translateX(0)}
  .ana-row-c{flex:none;min-width:22px;text-align:center;font:800 9.5px/1 var(--jakarta);color:var(--violet);
    background:rgba(107,63,160,.11);border-radius:6px;padding:3px 5px}
  .ana-row-l{flex:0 0 74px;font:600 11px/1.2 var(--jakarta);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ana-row-track{flex:1;height:8px;background:rgba(123,90,189,.10);border-radius:5px;overflow:hidden}
  .ana-row-fill{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .ana-row-v{flex:none;font:800 11px var(--jakarta);color:var(--ink);min-width:34px;text-align:right;letter-spacing:.01em}
  .ana-more{font:600 9px var(--jakarta);color:var(--muted);padding:2px 0 4px}
  .ana-empty{font:500 11px var(--jakarta);color:var(--muted);padding:4px 0}
  /* synthèse IA */
  .ana-ia{margin-top:12px;padding-top:13px;border-top:1px solid var(--ln-soft)}
  .ana-ia-btn{width:100%;border:none;cursor:pointer;border-radius:11px;background:var(--grad);color:#fff;
    font:800 10px/1 var(--jakarta);letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;
    box-shadow:0 8px 20px -7px rgba(86,80,198,.6)}

  .ana-drill-head{display:flex;align-items:center;gap:9px;padding:4px 0 11px;border-bottom:1px solid var(--ln-soft);margin-bottom:9px}
  .ana-back{flex:none;border:1px solid var(--ln);background:#fff;color:var(--violet);cursor:pointer;
    font:700 9px/1 var(--jakarta);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:9px}
