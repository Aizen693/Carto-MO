<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUMINT — Algor Int</title>
<!-- Gate premium : overlay bloquant tant que session + plan premium absents. -->
<script>window.addEventListener('algorAuthReady', function () { window.__algorAuthGranted = true; });</script>
<script type="module" src="../shared/site-auth.js?v=20260616a"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<link rel="stylesheet" href="../shared/styles.css?v=20260420h">
<style>
  :root{
    --bg:#0d1117; --panel:rgba(17,18,20,0.97); --ln:rgba(255,255,255,0.08);
    --gold:#c49a3c; --gold-soft:#e0b452; --tx:#e8e6e1; --tx2:#727a87; --tx3:#3e444e;
    --jakarta:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--jakarta);overflow:hidden}
  #map{position:absolute;inset:0}
  #loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;
    background:rgba(8,9,11,0.6);font:500 12px/1 var(--mono);letter-spacing:.12em;color:var(--gold);text-transform:uppercase}

  /* ── Header ── */
  #header{position:absolute;top:0;left:0;right:0;height:54px;z-index:8;display:flex;align-items:center;gap:18px;
    padding:0 16px;background:var(--panel);border-bottom:1px solid var(--ln);backdrop-filter:blur(8px)}
  #header .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
  #header .brand img{height:26px;opacity:.7}
  #country-title{margin:0;font:700 17px/1 var(--jakarta);letter-spacing:.01em;color:#fff}
  #header .sub{font:500 8px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);margin-top:4px}
  #header .spacer{flex:1}
  #counter{font:500 10px/1 var(--mono);letter-spacing:.1em;color:var(--gold-soft);text-transform:uppercase}
  .hdr-tag{font:600 8px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
    border:1px solid var(--ln);padding:5px 9px;border-radius:2px}

  /* ── Barre à jetons ── */
  #chipbar{position:absolute;top:66px;left:16px;z-index:7;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 32px)}
  .chip{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--ln);
    background:var(--panel);color:var(--tx);padding:7px 11px;border-radius:3px;font-family:var(--jakarta);
    transition:border-color .12s,background .12s}
  .chip:hover{border-color:rgba(196,154,60,.5)}
  .chip-key{font:600 7px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx2)}
  .chip-val{font:600 12px/1 var(--jakarta);color:#fff}
  .chip-x{font-size:9px;color:var(--tx2);margin-left:1px}
  .chip-locked{border-top:1px solid var(--gold);border-bottom-color:rgba(196,154,60,.25)}
  .chip-locked .chip-val{color:var(--gold-soft)}
  .chip-active{border-color:rgba(196,154,60,.55);background:rgba(196,154,60,.08)}
  .chip-active .chip-key{color:var(--gold)}

  /* ── Popover facette ── */
  .facet-pop{position:fixed;z-index:20;width:260px;max-height:50vh;overflow:hidden;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--ln);border-top:1px solid var(--gold);border-radius:4px;
    box-shadow:0 14px 40px rgba(0,0,0,.55)}
  .facet-pop-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--ln)}
  .facet-pop-head span{font:600 8px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx2)}
  .facet-clear{background:none;border:1px solid var(--ln);color:var(--tx2);cursor:pointer;
    font:600 8px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:2px}
  .facet-clear:hover{color:var(--gold-soft);border-color:rgba(196,154,60,.4)}
  .facet-pop-body{overflow-y:auto;padding:6px}
  .facet-opt{display:flex;align-items:center;gap:8px;padding:7px 8px;cursor:pointer;border-radius:2px;
    font:500 12px/1.2 var(--jakarta);color:var(--tx)}
  .facet-opt:hover{background:rgba(255,255,255,.04)}
  .facet-opt.on{background:rgba(196,154,60,.1)}
  .facet-opt input{accent-color:var(--gold);margin:0}
  .facet-dot{width:8px;height:8px;border-radius:50%;flex:none}

  /* ── Sélecteur de pays (jeton PAYS) ── */
  #country-switch{position:absolute;top:108px;left:16px;z-index:19;width:260px;display:none}
  #country-switch.open{display:block}
  #country-switch input{width:100%;background:var(--panel);border:1px solid var(--gold);color:#fff;
    padding:9px 11px;border-radius:3px 3px 0 0;font:500 13px var(--jakarta);outline:none}
  #country-switch-results{background:var(--panel);border:1px solid var(--ln);border-top:none;border-radius:0 0 3px 3px;
    max-height:40vh;overflow-y:auto}
  .cs-result{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;cursor:pointer;
    font:600 13px var(--jakarta);color:var(--tx);border-top:1px solid rgba(255,255,255,.04)}
  .cs-result:hover{background:rgba(196,154,60,.1);color:#fff}
  .cs-count{font:500 9px var(--mono);color:var(--tx2)}
  .cs-empty{padding:11px;font:500 11px var(--jakarta);color:var(--tx2)}

  /* ── Légende ── */
  #legend{position:absolute;top:66px;right:14px;z-index:7;width:212px;max-height:calc(100% - 96px);
    display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--ln);border-radius:4px}
  #legend .lg-head{padding:10px 13px;border-bottom:1px solid var(--ln);
    font:600 8px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx2)}
  #legend-items{overflow-y:auto;padding:6px}
  .legend-row{display:flex;align-items:center;gap:8px;padding:5px 7px;font:500 11px/1 var(--jakarta);color:var(--tx)}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .legend-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend-count{font:500 9px var(--mono);color:var(--tx2)}
  .legend-empty{padding:10px 8px;font:500 11px var(--jakarta);color:var(--tx2)}

  /* ── Popups ── */
  .humint-popup .mapboxgl-popup-content{background:#111316;border:1px solid var(--ln);border-top:2px solid var(--gold);
    border-radius:4px;padding:0;color:var(--tx);box-shadow:0 12px 36px rgba(0,0,0,.6)}
  .humint-popup .mapboxgl-popup-tip{border-top-color:#111316}
  .humint-popup .mapboxgl-popup-close-button{color:var(--tx2);font-size:16px;padding:2px 7px}
  .popup-header{display:flex;align-items:center;gap:9px;padding:10px 12px 8px}
  .popup-dot-bar{width:4px;height:16px;border-radius:2px;flex:none}
  .popup-actor{font:700 13px var(--jakarta);color:#fff}
  .popup-body{padding:0 12px 12px}
  .popup-row{display:flex;gap:10px;padding:4px 0;border-top:1px solid rgba(255,255,255,.05)}
  .popup-key{font:600 8px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);min-width:74px}
  .popup-val{font:400 12px/1.45 var(--jakarta);color:var(--tx)}
  .popup-desc .popup-val{font-size:12px;color:#cdd2d8}
  .popup-sources{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .popup-sources a{color:var(--gold-soft);text-decoration:none;font:500 10px var(--mono);border:1px solid rgba(196,154,60,.25);padding:1px 6px}
  .popup-sources span{color:var(--tx2);font:500 10px var(--mono)}

  @media(max-width:680px){
    #legend{display:none}
    #country-title{font-size:14px}
    .chip-val{font-size:11px}
  }
</style>
</head>
<body>

<div id="header">
  <a class="brand" href="../index.html" title="Changer de pays">
    <img src="../sahel/algor_int_logo.jpg" alt="Algor Int" onerror="this.style.display='none'">
  </a>
  <div>
    <h1 id="country-title">…</h1>
    <div class="sub">Renseignement HUMINT</div>
  </div>
  <div class="spacer"></div>
  <span id="counter"></span>
  <span class="hdr-tag">Confidentiel</span>
</div>

<div id="chipbar"></div>

<div id="country-switch">
  <input id="country-switch-input" type="text" placeholder="Changer de pays…" autocomplete="off">
  <div id="country-switch-results"></div>
</div>

<div id="map"><div id="loader">Chargement…</div></div>

<div id="legend">
  <div class="lg-head">Acteurs</div>
  <div id="legend-items"><div class="legend-empty">Chargement…</div></div>
</div>

<script src="../shared/humint-engine.js?v=20260616a"></script>
</body>
</html>
