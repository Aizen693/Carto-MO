<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructures 3D · CesiumJS (PoC) · Algor Access</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script>window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/';</script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
<style>
  :root{
    --violet:#6B3FA0; --violet-mid:#5650C6; --blue:#2E84D4;
    --grad:linear-gradient(95deg,#6B3FA0,#5650C6 55%,#2E84D4);
    --ink:#1F1437; --tx:#4A4460; --muted:#9089AA; --ln:rgba(123,90,189,.18);
    --shadow:0 10px 30px -10px rgba(46,24,87,.35);
    --jakarta:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0a12;color:#fff;font-family:var(--jakarta);overflow:hidden}
  #cesium{position:absolute;inset:0}
  .cesium-viewer-bottom,.cesium-widget-credits{display:none!important}
  #cesium canvas{outline:none}

  /* Barre haut */
  #top{position:absolute;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;gap:12px;padding:12px 16px;pointer-events:none}
  #top .brand{display:flex;align-items:center;gap:9px;pointer-events:auto;text-decoration:none;color:#fff}
  #top .brand b{font:800 15px/1 var(--jakarta)}
  #top .brand span{font:700 8px/1 var(--jakarta);letter-spacing:.16em;text-transform:uppercase;color:#c9bfe6;margin-top:4px}
  .poc-tag{font:800 8px/1 var(--jakarta);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--grad);padding:5px 9px;border-radius:7px}
  #top .sp{flex:1}
  .back{pointer-events:auto;text-decoration:none;font:700 9px/1 var(--jakarta);letter-spacing:.1em;text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.28);padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.06);backdrop-filter:blur(6px)}
  .back:hover{background:rgba(255,255,255,.14)}

  /* Panneau infrastructures */
  #side{position:absolute;top:60px;left:16px;z-index:8;width:290px;max-height:calc(100% - 150px);display:flex;flex-direction:column;
    background:rgba(20,16,34,.86);border:1px solid rgba(255,255,255,.12);border-radius:15px;box-shadow:0 18px 50px -16px rgba(0,0,0,.7);backdrop-filter:blur(14px);overflow:hidden}
  .s-head{padding:12px 15px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .s-kick{font:800 8px/1 var(--jakarta);letter-spacing:.16em;text-transform:uppercase;color:#b9a8e8}
  .s-title{font:800 13px/1.3 var(--jakarta);color:#fff;margin-top:6px}
  .s-list{overflow-y:auto;padding:7px}
  .s-list::-webkit-scrollbar{width:6px}.s-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:6px}
  .s-country{font:800 7.5px/1 var(--jakarta);letter-spacing:.14em;text-transform:uppercase;color:#8e84b6;padding:9px 8px 5px}
  .s-item{display:flex;align-items:center;gap:9px;width:100%;border:1px solid transparent;background:rgba(255,255,255,.03);cursor:pointer;text-align:left;
    padding:9px 11px;border-radius:10px;margin-bottom:4px;transition:border-color .14s,background .14s}
  .s-item:hover{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.07)}
  .s-item.on{background:var(--grad);border:none}
  .s-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .s-name{flex:1;font:700 12px/1.2 var(--jakarta);color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s-item.on .s-name{color:#fff}
  .s-badge{flex:none;font:800 7.5px/1 var(--jakarta);letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:4px 7px;border-radius:6px}

  /* Détail incidents */
  #detail{position:absolute;top:60px;right:16px;z-index:8;width:300px;max-height:calc(100% - 150px);display:none;flex-direction:column;
    background:rgba(20,16,34,.86);border:1px solid rgba(255,255,255,.12);border-radius:15px;box-shadow:0 18px 50px -16px rgba(0,0,0,.7);backdrop-filter:blur(14px);overflow:hidden}
  #detail.on{display:flex}
  .d-head{padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.08)}
  .d-name{font:800 14px/1.25 var(--jakarta);color:#fff}
  .d-status{display:inline-block;margin-top:7px;font:800 8px/1 var(--jakarta);letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:4px 8px;border-radius:6px}
  .d-body{overflow-y:auto;padding:10px 14px 14px}
  .d-sec{font:800 8px/1 var(--jakarta);letter-spacing:.14em;text-transform:uppercase;color:#b9a8e8;margin:6px 0 8px}
  .d-inc{border-left:2px solid var(--violet);padding:2px 0 8px 10px;margin-bottom:10px}
  .d-inc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .d-inc-type{font:700 12px/1.2 var(--jakarta);color:#fff}
  .d-inc-date{font:600 9px var(--mono);color:#9d93c4;white-space:nowrap}
  .d-inc-src{display:inline-block;margin-top:5px;font:800 7.5px var(--jakarta);letter-spacing:.04em;padding:2px 6px;border-radius:5px}
  .d-inc-desc{font:500 11px/1.5 var(--jakarta);color:#d8d2ea;margin-top:6px}


  #loading{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#171233,#0b0a12)}
  #loading.hidden{display:none}
  .l-t{font:800 10px/1 var(--jakarta);letter-spacing:.16em;text-transform:uppercase;color:#c9bfe6}
  .l-s{font:500 11px var(--jakarta);color:#8e84b6}
  .note{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(31,20,55,.94);color:#fff;font:600 11px/1.4 var(--jakarta);padding:9px 14px;border-radius:10px;max-width:520px;text-align:center;display:none}
  .note.on{display:block}
  #zoomctl{position:absolute;right:18px;bottom:24px;z-index:9;display:flex;flex-direction:column;gap:1px;border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
  #zoomctl button{width:42px;height:42px;border:none;cursor:pointer;background:rgba(20,16,34,.92);color:#fff;font:400 22px/1 var(--jakarta);backdrop-filter:blur(10px)}
  #zoomctl button:hover{background:var(--violet)}
  #zoomctl button:first-child{border-bottom:1px solid rgba(255,255,255,.12)}
</style>
</head>
<body>
<div id="cesium"></div>

<div id="top">
  <a class="brand" href="/carte/"><img src="../../sahel/algor_int_logo.jpg" style="height:28px;border-radius:6px" onerror="this.style.display='none'"><span style="display:flex;flex-direction:column"><b>Infrastructures 3D</b><span>CesiumJS · moteur d'analyse</span></span></a>
  <span class="poc-tag">PoC</span>
  <div class="sp"></div>
  <a class="back" href="/carte/">← Carte 2D</a>
</div>

<div id="side">
  <div class="s-head"><div class="s-kick">Infrastructures visées</div><div class="s-title" id="s-count">Chargement…</div></div>
  <div class="s-list" id="s-list"></div>
</div>

<div id="detail">
  <div class="d-head"><div class="d-name" id="d-name"></div><span class="d-status" id="d-status"></span></div>
  <div class="d-body" id="d-body"></div>
</div>

<div class="note" id="note"></div>

<div id="zoomctl">
  <button id="zin" title="Zoom avant">+</button>
  <button id="zout" title="Zoom arrière">−</button>
</div>

<div id="loading"><div class="l-t">Initialisation du moteur 3D</div><div class="l-s" id="l-s">CesiumJS…</div></div>

<script>
(function () {
  'use strict';
  var STATUS = {
    intact:   { label: 'Intact',    css: '#8FA0B8' },
    endommage:{ label: 'Endommagé', css: '#E0852E' },
    detruit:  { label: 'Détruit',   css: '#C0392B' },
  };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
  function statusOf(z) { return z.status || 'endommage'; }

  var viewer, zones = [], activeId = null, entities = [];

  function initViewer() {
    viewer = new Cesium.Viewer('cesium', {
      baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false,
      sceneModePicker: false, navigationHelpButton: false, animation: false, timeline: false,
      fullscreenButton: false, infoBox: false, selectionIndicator: false, requestRenderMode: false,
    });
    // Imagerie Esri HD (sans clé/token).
    viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
      url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      maximumLevel: 19, credit: 'Esri, Maxar, Earthstar Geographics',
    }));
    viewer.scene.globe.depthTestAgainstTerrain = true;
    viewer.scene.skyAtmosphere.show = true;
    viewer.scene.light = new Cesium.DirectionalLight({ direction: Cesium.Cartesian3.normalize(new Cesium.Cartesian3(0.3, -0.6, -0.9), new Cesium.Cartesian3()) });
    // clic sur entité → détail
    viewer.selectedEntityChanged.addEventListener(function (e) {
      if (e && e.__zoneId) { var z = zones.find(function (x) { return x.id === e.__zoneId; }); if (z) selectZone(z, false); }
    });
  }

  function ringToDegrees(ring) { var a = []; ring.forEach(function (p) { a.push(p[0], p[1]); }); return a; }
  function centroid(ring) { var x = 0, y = 0; ring.forEach(function (p) { x += p[0]; y += p[1]; }); return [x / ring.length, y / ring.length]; }

  function clearEntities() { entities.forEach(function (e) { viewer.entities.remove(e); }); entities = []; }

  function renderZone(z) {
    clearEntities();
    var col = STATUS[statusOf(z)].css;
    (z.structures || []).forEach(function (st) {
      var render = st.key || (st.damage && st.damage !== 'intact') || st.approx;
      // Couleur = statut du bâtiment : rouge = détruit, orange = endommagé, sinon neutre.
      var c = (STATUS[st.damage] && st.damage !== 'intact') ? STATUS[st.damage].css : (render ? col : '#d8d2c4');
      var h = st.height ? Math.max(6, st.height) : 4;
      var ring = st.footprint && st.footprint[0]; if (!ring) return;
      var e = viewer.entities.add({
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArray(ringToDegrees(ring)),
          extrudedHeight: h, material: Cesium.Color.fromCssColorString(c).withAlpha(render ? 0.92 : 0.55),
          outline: true, outlineColor: Cesium.Color.fromCssColorString(c).darken(0.3, new Cesium.Color()),
        },
      });
      e.__zoneId = z.id; entities.push(e);
    });
    // marqueur incident au centre
    var ctr = z.center || centroid((z.structures[0] && z.structures[0].footprint[0]) || [[0, 0]]);
    var m = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(ctr[0], ctr[1], 40),
      point: { pixelSize: 12, color: Cesium.Color.fromCssColorString(col), outlineColor: Cesium.Color.WHITE, outlineWidth: 2, disableDepthTestDistance: Number.POSITIVE_INFINITY },
      label: { text: z.name.split(' — ')[0], font: '600 12px "Plus Jakarta Sans"', fillColor: Cesium.Color.WHITE, style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 3, outlineColor: Cesium.Color.fromCssColorString('#1F1437'), pixelOffset: new Cesium.Cartesian2(0, -20), disableDepthTestDistance: Number.POSITIVE_INFINITY },
    });
    m.__zoneId = z.id; entities.push(m);
  }

  function selectZone(z, fly) {
    activeId = z.id;
    Array.prototype.forEach.call(document.querySelectorAll('.s-item'), function (el) { el.classList.toggle('on', el.getAttribute('data-id') === z.id); });
    renderZone(z);
    renderDetail(z);
    if (fly !== false) {
      var ctr = z.center;
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(ctr[0], ctr[1] - 0.006, 900),
        orientation: { heading: Cesium.Math.toRadians(20), pitch: Cesium.Math.toRadians(-38), roll: 0 },
        duration: 2.2,
      });
    }
  }

  function renderDetail(z) {
    $('d-name').textContent = z.name;
    var st = STATUS[statusOf(z)];
    var sEl = $('d-status'); sEl.textContent = st.label; sEl.style.background = st.css;
    var evs = z.events || [];
    $('d-body').innerHTML = '<div class="d-sec">Renseignement (source du marquage)</div>' + (evs.length ? evs.map(function (e) {
      var sc = (e.source || '').toUpperCase() === 'OSINT' ? '#2E84D4' : '#6B3FA0';
      return '<div class="d-inc"><div class="d-inc-top"><span class="d-inc-type">' + esc(e.type || 'Événement') + '</span><span class="d-inc-date">' + esc(e.date || '') + '</span></div>' +
        '<span class="d-inc-src" style="background:' + sc + ';color:#fff">' + esc((e.source || '').toUpperCase()) + (e.corrobore ? ' ✓' : '') + '</span>' +
        (e.actor ? ' <span class="d-inc-date">' + esc(e.actor) + '</span>' : '') +
        '<div class="d-inc-desc">' + esc((e.description || '').slice(0, 300)) + '</div></div>';
    }).join('') : '<div class="d-inc-desc">—</div>');
    $('detail').classList.add('on');
  }

  function buildList() {
    var byPays = {};
    zones.forEach(function (z) { (byPays[z.pays] = byPays[z.pays] || []).push(z); });
    var rank = { detruit: 2, endommage: 1, intact: 0 };
    var html = '';
    Object.keys(byPays).sort().forEach(function (pays) {
      html += '<div class="s-country">' + esc(pays) + '</div>';
      byPays[pays].sort(function (a, b) { return (rank[statusOf(b)] || 0) - (rank[statusOf(a)] || 0); }).forEach(function (z) {
        var st = STATUS[statusOf(z)];
        html += '<button class="s-item" data-id="' + esc(z.id) + '"><span class="s-dot" style="background:' + st.css + '"></span>' +
          '<span class="s-name">' + esc(z.name) + '</span><span class="s-badge" style="background:' + st.css + '">' + esc(st.label) + '</span></button>';
      });
    });
    $('s-list').innerHTML = html;
    $('s-count').textContent = zones.length + ' infrastructures';
    Array.prototype.forEach.call(document.querySelectorAll('.s-item'), function (el) {
      el.onclick = function () { var z = zones.find(function (x) { return x.id === el.getAttribute('data-id'); }); if (z) selectZone(z, true); };
    });
  }

  function showNote(msg) { var n = $('note'); n.textContent = msg; n.classList.add('on'); setTimeout(function () { n.classList.remove('on'); }, 6000); }

  function boot() {
    initViewer();
    fetch('/carte/zones-3d.json?v=20260630r').then(function (r) { return r.json(); }).then(function (d) {
      zones = (d && d.zones) || [];
      buildList();
      $('loading').classList.add('hidden');
      if (zones.length) selectZone(zones.find(function (z) { return z.category === 'aeroport'; }) || zones[0], true);
    }).catch(function (e) { $('l-s').textContent = 'Données indisponibles: ' + e.message; });
    var zstep = function (dir) { var h = viewer.camera.positionCartographic.height || 1000; var amt = Math.max(50, h * 0.35); dir > 0 ? viewer.camera.zoomIn(amt) : viewer.camera.zoomOut(amt); };
    $('zin').onclick = function () { zstep(1); };
    $('zout').onclick = function () { zstep(-1); };
  }

  if (typeof Cesium === 'undefined') { $('l-s').textContent = 'CesiumJS n\'a pas pu charger (réseau/CDN).'; }
  else boot();
})();
</script>
</body>
</html>
